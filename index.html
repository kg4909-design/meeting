<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실전 소개팅 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #1e293b; border-radius: 24px; padding: 28px 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #f1f5f9; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .input-box { margin-bottom: 20px; text-align: left; }
    .input-box label { font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600; }
    .input-box input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13px; outline: none; }
    .status-area { height: 70px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .status-text { font-size: 15px; color: #38bdf8; font-weight: 500; }
    .mic-button { width: 110px; height: 110px; border-radius: 50%; border: none; background: #3b82f6; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 24px auto; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
    .mic-button.active { background: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
    .control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 12px; border-radius: 12px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; color: white; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn-feedback { background: #8b5cf6; }
    .btn-next { background: #10b981; }
    .guide { margin-top: 22px; font-size: 11px; color: #64748b; line-height: 1.6; text-align: left; background: #0f172a; padding: 12px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>실전 소개팅 시뮬레이터</h1>
    <p class="sub">차량 및 일상 핸즈프리 실시간 대화 훈련</p>

    <div class="input-box" id="keyBox">
      <label for="apiKey">Google AI Studio API Key</label>
      <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 키를 붙여넣으세요">
    </div>

    <div class="status-area">
      <div class="status-text" id="statusText">통화 시작 버튼을 누르세요</div>
    </div>

    <button class="mic-button" id="startBtn" onclick="toggleSession()">
      <span id="btnLabel">통화 시작</span>
    </button>

    <div class="control-row">
      <button class="btn btn-feedback" onclick="sendQuickText('타임! 방금 대화 내용 냉정하게 피드백해줘.')">피드백 요청</button>
      <button class="btn btn-next" onclick="sendQuickText('다음 사람으로 완전히 바꿔서 새로 시작해줘.')">다음 사람</button>
    </div>

    <div class="guide">
      • 말로 "타임" 또는 "피드백"이라고 해도 즉시 분석해 줍니다.<br>
      • 말로 "다음 사람"이라고 하면 새 소개팅 상대로 전환됩니다.<br>
      • 핸드폰 잠금 화면이 꺼지지 않도록 거치해두고 사용하세요.
    </div>
  </div>

  <script>
    const SYSTEM_INSTRUCTION = `
[실전 소개팅 시뮬레이터 & 대화 분석 성장 코치]
1. 말투 및 음성 대화 원칙:
- 절대 먼저 반말을 쓰지 마세요. 세련되고 단정한 존댓말(~해요, ~하셨어요?, ~네요)을 100% 유지합니다.
- 조급하게 말을 쏟아내지 말고 차분한 호흡으로 대화하세요. 턴당 발화는 1~2문장(최대 3문장)으로 끊어 상대의 리액션 공간을 반드시 남기세요.
- AI 티를 내는 안내(예: "시작하겠습니다")는 절대 하지 마세요. 조용한 카페/식당에 마주 앉은 직후의 자연스러운 첫인사로 즉시 시작하세요.

2. 무작위 페르소나 풀 (세션마다 무작위 조합):
- 28~34세 직장인 여성 (초·중등 교사, 공기업/행정, IT/기획, 연구원, 약사, 금융권 등).
- 성향 (택 1):
  A. 리액션 좋고 밝으며 티키타카가 빠른 외향형
  B. 차분하고 관찰력이 높으며 취향(미식/문화/여행)이 뚜렷한 신중형 (초반엔 조심스럽게 반응)
  C. 라이프스타일과 직업적 가치관이 뚜렷하고 현실적인 직진형

3. 정밀 대화 분석 및 단계별 개선 피드백 ("타임" 또는 "피드백" 요청 시):
역할을 즉시 멈추고 직전 대화를 분석하여 아래 4가지를 명확히 음성으로 답변하세요:
1) 호감도 점수 (10점 만점 및 이유)
2) 대화 맹점 분석 (설명충 모드, 취조형 질문, 상대 키워드 흘림 여부)
3) 당장 개선해야 할 발전 영역 1가지
4) 실전 개선 3단계 액션 스텝 (Step 1: 바로 쓸 대사 예시, Step 2: 호흡/톤, Step 3: 속마음 유도 질문법)

4. 상대 남성 기본 정보:
- 1991년생 35세 남성 초등교사(호칭: 건 님). 깔끔하고 차분한 스타일. 긴장해서 혼자 길게 설명하려는 버릇을 통제하고 상대의 호감을 자연스럽게 이끌어내는 HUMINT 대화술 훈련 중.
`;

    let websocket = null;
    let audioContext = null;
    let inputSource = null;
    let processor = null;
    let isConnected = false;
    let nextPlayTime = 0;

    async function toggleSession() {
      if (isConnected) {
        disconnectSession();
      } else {
        await connectSession();
      }
    }

    async function connectSession() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        alert("구글 AI 스튜디오에서 발급받은 API 키를 입력해 주세요.");
        return;
      }
      localStorage.setItem("gemini_api_key", apiKey);

      updateStatus("소개팅 연결 중...", "#facc15");

      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 } });

        const host = "generativelanguage.googleapis.com";
        const path = `/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
        const uri = `wss://${host}${path}`;

        websocket = new WebSocket(uri);

        websocket.onopen = () => {
          isConnected = true;
          updateStatus("대화 중 (상대방이 마주 앉았습니다)", "#4ade80");
          document.getElementById('startBtn').classList.add('active');
          document.getElementById('btnLabel').innerText = "통화 종료";
          document.getElementById('keyBox').style.display = "none";

          // 초기 시스템 지침 전송
          const setupMessage = {
            setup: {
              model: "models/gemini-2.0-flash-exp",
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } }
                }
              },
              systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
            }
          };
          websocket.send(JSON.stringify(setupMessage));

          // 마이크 오디오 전송 시작
          startAudioStreaming(stream);
        };

        websocket.onmessage = async (event) => {
          let responseData;
          if (event.data instanceof Blob) {
            responseData = JSON.parse(await event.data.text());
          } else {
            responseData = JSON.parse(event.data);
          }

          if (responseData.serverContent?.modelTurn?.parts) {
            for (const part of responseData.serverContent.modelTurn.parts) {
              if (part.inlineData?.mimeType?.startsWith("audio/pcm")) {
                playPcmChunk(part.inlineData.data);
              }
            }
          }

          if (responseData.serverContent?.interrupted) {
            nextPlayTime = audioContext.currentTime;
          }
        };

        websocket.onerror = (err) => {
          console.error("WebSocket 오류", err);
          updateStatus("연결 오류가 발생했습니다.", "#ef4444");
          disconnectSession();
        };

        websocket.onclose = () => {
          disconnectSession();
        };

      } catch (err) {
        console.error(err);
        alert("마이크 권한을 허용해야 대화를 시작할 수 있습니다.");
        disconnectSession();
      }
    }

    function startAudioStreaming(stream) {
      const inputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      inputSource = inputContext.createMediaStreamSource(stream);
      processor = inputContext.createScriptProcessor(4096, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!isConnected || websocket.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);
        
        // 16-bit PCM 변환
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        const uint8 = new Uint8Array(pcm16.buffer);
        let binary = '';
        for (let i = 0; i < uint8.byteLength; i++) {
          binary += String.fromCharCode(uint8[i]);
        }
        const base64Audio = btoa(binary);

        const audioPacket = {
          realtimeInput: {
            mediaChunks: [
              { mimeType: "audio/pcm;rate=16000", data: base64Audio }
            ]
          }
        };
        websocket.send(JSON.stringify(audioPacket));
      };

      inputSource.connect(processor);
      processor.connect(inputContext.destination);
    }

    function playPcmChunk(base64Data) {
      const binaryString = atob(base64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) {
        float32[i] = int16[i] / 32768.0;
      }

      const buffer = audioContext.createBuffer(1, float32.length, 24000);
      buffer.getChannelData(0).set(float32);

      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);

      const currentTime = audioContext.currentTime;
      if (nextPlayTime < currentTime) {
        nextPlayTime = currentTime;
      }
      source.start(nextPlayTime);
      nextPlayTime += buffer.duration;
    }

    function sendQuickText(textMessage) {
      if (!isConnected || websocket.readyState !== WebSocket.OPEN) {
        alert("먼저 통화를 시작해 주세요.");
        return;
      }
      const textPacket = {
        clientContent: {
          turns: [{
            role: "user",
            parts: [{ text: textMessage }]
          }],
          turnComplete: true
        }
      };
      websocket.send(JSON.stringify(textPacket));
    }

    function disconnectSession() {
      isConnected = false;
      if (websocket) { websocket.close(); websocket = null; }
      if (processor) { processor.disconnect(); processor = null; }
      if (inputSource) { inputSource.disconnect(); inputSource = null; }
      if (audioContext) { audioContext.close(); audioContext = null; }
      updateStatus("통화가 종료되었습니다.", "#94a3b8");
      document.getElementById('startBtn').classList.remove('active');
      document.getElementById('btnLabel').innerText = "통화 시작";
    }

    function updateStatus(text, color) {
      const el = document.getElementById('statusText');
      el.innerText = text;
      el.style.color = color;
    }

    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }
    };
  </script>
</body>
</html>
